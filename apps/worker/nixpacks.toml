# Nixpacks-конфіг для сервісу worker на Railway.
# Головне: ffmpeg (рендер відео) і шрифти DejaVu (кирилиця в ASS-субтитрах).

[phases.setup]
nixPkgs = ["...", "ffmpeg", "dejavu_fonts", "fontconfig"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build -w packages/shared && npm run build -w apps/worker"]

[start]
cmd = "npm run start -w apps/worker"
