<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Чи Ви Знали? — публікації</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --surface: var(--tg-theme-secondary-bg-color, #1a1d24);
      --text: var(--tg-theme-text-color, #f2f4f8);
      --muted: var(--tg-theme-hint-color, #8a93a6);
      --link: var(--tg-theme-link-color, #7c9cff);
      --accent: var(--tg-theme-button-color, #6c5ce7);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --ok: #2ecc71;
      --border: color-mix(in srgb, var(--muted) 22%, transparent);
      --radius: 18px;
      --shadow: 0 8px 30px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 0 14px calc(28px + env(safe-area-inset-bottom));
      max-width: 620px;
      margin: 0 auto;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(12px);
      padding: 14px 2px 10px;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 42px; height: 42px; flex: 0 0 42px; border-radius: 13px;
      display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ff7ac6));
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
    header p { font-size: 12.5px; margin: 1px 0 0; color: var(--muted); }
    .count { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }

    h2.section {
      font-size: 13px; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin: 22px 4px 10px; font-weight: 700;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    /* Шапка картки — завжди видима, клік згортає/розгортає. */
    .card-head {
      display: flex; align-items: center; gap: 11px;
      padding: 14px 15px; cursor: pointer; user-select: none;
    }
    .dot { width: 11px; height: 11px; flex: 0 0 11px; border-radius: 50%; position: relative; }
    .dot.pending { background: #f5b60a; box-shadow: 0 0 0 4px color-mix(in srgb, #f5b60a 22%, transparent); }
    .dot.pending::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: #f5b60a; animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.4); opacity: 0; } }
    .head-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .chev { flex: 0 0 auto; color: var(--muted); transition: transform .2s; font-size: 13px; }
    .card.open .chev { transform: rotate(90deg); }
    .card-body-wrap { display: none; }
    .card.open .card-body-wrap { display: block; }
    @media (prefers-reduced-motion: reduce) { .dot.pending::after { animation: none; } }

    .video-wrap { position: relative; background: #000; }
    .video-wrap video { width: 100%; display: block; max-height: 62vh; object-fit: contain; background: #000; }
    .card-body { padding: 14px 15px 16px; }

    .kicker { font-size: 11.5px; color: var(--muted); letter-spacing: .3px; margin-bottom: 8px; }

    .copyable {
      position: relative; border: 1px solid var(--border); border-radius: 13px;
      padding: 12px 13px; background: color-mix(in srgb, var(--bg) 45%, var(--surface));
      cursor: pointer; transition: border-color .15s, transform .05s;
      margin-bottom: 11px;
    }
    .copyable:active { transform: scale(.995); }
    .copyable .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .copyable .title-text { font-size: 16.5px; font-weight: 650; line-height: 1.35; }
    .copyable .desc-text { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; color: color-mix(in srgb, var(--text) 92%, transparent); }
    .copyable .tap { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--link); font-weight: 600; }
    .copyable.copied { border-color: var(--ok); }
    .copyable.copied .tap { color: var(--ok); }

    .actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn {
      flex: 1; border: 0; border-radius: 13px; padding: 13px 14px;
      font-size: 15px; font-weight: 650; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: transform .05s, opacity .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn.secondary { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--text); text-decoration: none; }
    .btn.primary { background: var(--accent); color: var(--accent-text); }
    .btn.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .btn[disabled] { opacity: .55; pointer-events: none; }

    .published-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 13px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 13px; margin-bottom: 8px;
    }
    .published-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: 0 0 8px; }
    .published-item .pi-text { min-width: 0; }
    .published-item .pi-title { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .published-item .pi-date { font-size: 12px; color: var(--muted); }

    .empty { text-align: center; color: var(--muted); padding: 34px 20px; }
    .empty .big { font-size: 34px; margin-bottom: 10px; }
    .skeleton { height: 220px; border-radius: var(--radius); background: linear-gradient(100deg, var(--surface) 30%, color-mix(in srgb, var(--muted) 12%, var(--surface)) 50%, var(--surface) 70%); background-size: 200% 100%; animation: sh 1.3s infinite; margin-bottom: 16px; }
    @keyframes sh { to { background-position: -200% 0; } }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .banner { background: color-mix(in srgb, #e67e22 20%, var(--surface)); border: 1px solid color-mix(in srgb, #e67e22 40%, transparent); color: var(--text); padding: 12px 14px; border-radius: 13px; font-size: 13.5px; margin: 10px 2px 4px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">💡</div>
    <div>
      <h1>Чи Ви Знали?</h1>
      <p>Публікація готових роликів</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div id="banner"></div>
  <main id="app">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:120px"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const initData = tg?.initData || '';
    const haptic = (t='light') => tg?.HapticFeedback?.impactOccurred?.(t);
    const notify = (t='success') => tg?.HapticFeedback?.notificationOccurred?.(t);

    const $ = (sel) => document.querySelector(sel);
    const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1700);
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
    }

    function copyable({ label, icon, main, isDesc, raw }) {
      const box = el('div', 'copyable');
      box.appendChild(el('div', 'label', `${icon} ${label}`));
      box.appendChild(el('div', isDesc ? 'desc-text' : 'title-text', esc(main)));
      box.appendChild(el('div', 'tap', 'копіювати'));
      box.addEventListener('click', async () => {
        await copyText(raw ?? main);
        box.classList.add('copied'); box.querySelector('.tap').textContent = 'скопійовано ✓';
        haptic('light'); toast('Скопійовано');
        setTimeout(() => { box.classList.remove('copied'); box.querySelector('.tap').textContent = 'копіювати'; }, 1600);
      });
      return box;
    }

    // Які картки розгорнуті (за id) — зберігається між оновленнями списку.
    const expanded = new Set();
    let expandInit = false;

    function queueCard(item) {
      const card = el('div', 'card'); card.dataset.id = item.id;

      // Шапка: жовтий кружечок «очікує публікації» + назва + шеврон.
      const head = el('div', 'card-head');
      head.appendChild(el('span', 'dot pending'));
      head.appendChild(el('div', 'head-title', esc(item.title)));
      head.appendChild(el('span', 'chev', '▶'));
      card.appendChild(head);

      const wrap = el('div', 'card-body-wrap');
      const vw = el('div', 'video-wrap');
      const v = el('video'); v.controls = true; v.playsInline = true; v.preload = 'none';
      v.dataset.src = item.videoUrl; // джерело вантажимо лише коли розгорнуто
      vw.appendChild(v); wrap.appendChild(vw);

      const body = el('div', 'card-body');
      if (item.theme) body.appendChild(el('div', 'kicker', esc(item.theme)));
      body.appendChild(copyable({ label: 'Назва', icon: '📌', main: item.title }));
      body.appendChild(copyable({ label: 'Опис + хештеги', icon: '📝', main: item.description, isDesc: true }));
      const actions = el('div', 'actions');
      const dl = el('a', 'btn secondary', '⬇️ Відео'); dl.href = item.videoUrl; dl.download = `${item.id}.mp4`;
      const pub = el('button', 'btn primary', '✅ Опубліковано');
      pub.addEventListener('click', (e) => { e.stopPropagation(); publish(item, card, pub); });
      actions.appendChild(dl); actions.appendChild(pub);
      body.appendChild(actions);
      wrap.appendChild(body);
      card.appendChild(wrap);

      const setOpen = (open) => {
        card.classList.toggle('open', open);
        if (open) { expanded.add(item.id); if (!v.src) v.src = v.dataset.src; }
        else expanded.delete(item.id);
      };
      head.addEventListener('click', () => setOpen(!card.classList.contains('open')));
      if (expanded.has(item.id)) setOpen(true);
      return card;
    }

    async function publish(item, card, btn) {
      if (!initData) { toast('Відкрий через Telegram, щоб публікувати'); return; }
      btn.disabled = true; btn.textContent = 'Публікую…';
      try {
        const r = await fetch('/api/publish', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: item.id, initData }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Помилка');
        btn.className = 'btn done'; btn.textContent = '✓ Опубліковано'; notify('success'); toast('Позначено як опубліковане');
        setTimeout(load, 900);
      } catch (e) {
        btn.disabled = false; btn.className = 'btn primary'; btn.textContent = '✅ Опубліковано';
        notify('error'); toast(e.message);
      }
    }

    function publishedRow(it) {
      const row = el('div', 'published-item');
      row.appendChild(el('div', 'dot'));
      const t = el('div', 'pi-text');
      t.appendChild(el('div', 'pi-title', esc(it.title || it.theme)));
      if (it.pubDate) t.appendChild(el('div', 'pi-date', esc(it.pubDate)));
      row.appendChild(t);
      return row;
    }

    function render(state) {
      const app = $('#app'); app.innerHTML = '';
      const banner = $('#banner'); banner.innerHTML = '';
      if (!state.googleReady) banner.appendChild(el('div', 'banner', '⚙️ Google-доступ ще не налаштовано на сервері — черга поки порожня.'));
      else if (state.videoFolderSet === false) banner.appendChild(el('div', 'banner', '⚙️ Не задано папку Drive для відео (VIDEO_FOLDER_ID) — монтаж вимкнено.'));

      const q = state.queue || [];
      $('#count').textContent = q.length ? `${q.length} до публікації` : '';
      // За замовчуванням розгортаємо лише найновішу картку; решта — згорнуті.
      if (!expandInit && q.length) { expanded.add(q[0].id); expandInit = true; }

      if (q.length) {
        app.appendChild(el('h2', 'section', 'До публікації'));
        q.forEach((item) => app.appendChild(queueCard(item)));
      } else {
        app.appendChild(el('div', 'empty', '<div class="big">✅</div>Немає нових роликів.<br>Щойно ChatGPT підготує тему — я пришлю сповіщення.'));
      }

      const p = state.published || [];
      if (p.length) {
        app.appendChild(el('h2', 'section', `Опубліковано · ${p.length}`));
        p.slice(0, 40).forEach((it) => app.appendChild(publishedRow(it)));
      }
    }

    async function load() {
      try {
        const r = await fetch('/api/state');
        render(await r.json());
      } catch (e) {
        $('#app').innerHTML = `<div class="empty"><div class="big">⚠️</div>Не вдалося завантажити.<br>${esc(e.message)}</div>`;
      }
    }

    load();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
