<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Чи Ви Знали? — публікації</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --surface: var(--tg-theme-secondary-bg-color, #1a1d24);
      --text: var(--tg-theme-text-color, #f2f4f8);
      --muted: var(--tg-theme-hint-color, #8a93a6);
      --link: var(--tg-theme-link-color, #7c9cff);
      --accent: var(--tg-theme-button-color, #6c5ce7);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --ok: #2ecc71;
      --border: color-mix(in srgb, var(--muted) 22%, transparent);
      --radius: 18px;
      --shadow: 0 8px 30px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 0 14px calc(28px + env(safe-area-inset-bottom));
      max-width: 620px;
      margin: 0 auto;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(12px);
      padding: 14px 2px 10px;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 42px; height: 42px; flex: 0 0 42px; border-radius: 13px;
      display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ff7ac6));
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
    header p { font-size: 12.5px; margin: 1px 0 0; color: var(--muted); }
    .count { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }

    h2.section {
      font-size: 13px; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin: 22px 4px 10px; font-weight: 700;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    /* Шапка картки — завжди видима, клік згортає/розгортає. */
    .card-head {
      display: flex; align-items: center; gap: 11px;
      padding: 14px 15px; cursor: pointer; user-select: none;
    }
    .dot { width: 11px; height: 11px; flex: 0 0 11px; border-radius: 50%; position: relative; }
    .dot.pending { background: #f5b60a; box-shadow: 0 0 0 4px color-mix(in srgb, #f5b60a 22%, transparent); }
    .dot.pending::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: #f5b60a; animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.4); opacity: 0; } }
    .head-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .chev { flex: 0 0 auto; color: var(--muted); transition: transform .2s; font-size: 13px; }
    .card.open .chev { transform: rotate(90deg); }
    .card-body-wrap { display: none; }
    .card.open .card-body-wrap { display: block; }
    @media (prefers-reduced-motion: reduce) { .dot.pending::after { animation: none; } }

    .video-wrap { position: relative; background: #000; }
    .video-wrap video { width: 100%; display: block; max-height: 62vh; object-fit: contain; background: #000; }
    .card-body { padding: 14px 15px 16px; }

    .kicker { font-size: 11.5px; color: var(--muted); letter-spacing: .3px; margin-bottom: 8px; }

    .copyable {
      position: relative; border: 1px solid var(--border); border-radius: 13px;
      padding: 12px 13px; background: color-mix(in srgb, var(--bg) 45%, var(--surface));
      cursor: pointer; transition: border-color .15s, transform .05s;
      margin-bottom: 11px;
    }
    .copyable:active { transform: scale(.995); }
    .copyable .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .copyable .title-text { font-size: 16.5px; font-weight: 650; line-height: 1.35; }
    .copyable .desc-text { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; color: color-mix(in srgb, var(--text) 92%, transparent); }
    .copyable .tap { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--link); font-weight: 600; }
    .copyable.copied { border-color: var(--ok); }
    .copyable.copied .tap { color: var(--ok); }

    .actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn {
      flex: 1; border: 0; border-radius: 13px; padding: 13px 14px;
      font-size: 15px; font-weight: 650; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: transform .05s, opacity .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn.secondary { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--text); text-decoration: none; }
    .btn.primary { background: var(--accent); color: var(--accent-text); }
    .btn.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .btn[disabled] { opacity: .55; pointer-events: none; }

    .published-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 13px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 13px; margin-bottom: 8px;
    }
    .published-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: 0 0 8px; }
    .published-item .pi-text { min-width: 0; }
    .published-item .pi-title { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .published-item .pi-date { font-size: 12px; color: var(--muted); }

    /* Чернетка сценарію (тема на перевірку) */
    .draft { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .draft .theme { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
    .slide-row { border-top: 1px solid var(--border); padding: 10px 0; }
    .slide-row .num { font-size: 11px; color: var(--muted); letter-spacing: .5px; }
    .slide-row .stext { font-size: 15px; font-weight: 650; margin: 3px 0 4px; }
    .slide-row .simg { font-size: 13px; color: var(--muted); line-height: 1.45; }
    .notes { width: 100%; margin-top: 12px; padding: 11px 12px; font: inherit; font-size: 14.5px;
      color: var(--text); background: color-mix(in srgb, var(--bg) 45%, var(--surface));
      border: 1px solid var(--border); border-radius: 12px; resize: vertical; min-height: 72px; }
    .notes::placeholder { color: var(--muted); }
    .draft .actions { margin-top: 11px; flex-wrap: wrap; }

    .empty { text-align: center; color: var(--muted); padding: 34px 20px; }
    .empty .big { font-size: 34px; margin-bottom: 10px; }
    .skeleton { height: 220px; border-radius: var(--radius); background: linear-gradient(100deg, var(--surface) 30%, color-mix(in srgb, var(--muted) 12%, var(--surface)) 50%, var(--surface) 70%); background-size: 200% 100%; animation: sh 1.3s infinite; margin-bottom: 16px; }
    @keyframes sh { to { background-position: -200% 0; } }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .banner { background: color-mix(in srgb, #e67e22 20%, var(--surface)); border: 1px solid color-mix(in srgb, #e67e22 40%, transparent); color: var(--text); padding: 12px 14px; border-radius: 13px; font-size: 13.5px; margin: 10px 2px 4px; }

    /* Свій сюжет: згорнутий рядок-посилання, щоб не відтягував увагу від черги */
    .own-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 0; padding: 4px 2px; margin: 2px 0 0;
      color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
    }
    .own-toggle:active { opacity: .6; }
    .own-panel {
      display: none; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin: 8px 0 4px;
    }
    .own-panel.open { display: block; }
    .own-hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
    .own-files { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
    .own-chip {
      font-size: 12px; padding: 4px 9px; border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--text);
    }
    .own-actions { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">💡</div>
    <div>
      <h1>Чи Ви Знали?</h1>
      <p>Публікація готових роликів</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div id="banner"></div>

  <button class="own-toggle" id="ownToggle">✍️ Свій сюжет</button>
  <div class="own-panel" id="ownPanel">
    <p class="own-hint">
      Напиши сюжет своїми словами й, за бажанням, додай кілька своїх фото.
      ChatGPT розіб'є текст на слайди, підбере твої фото під них і доведе до
      формату 9:16, а чого забракне — домалює. Можна надіслати й самі фото
      без тексту — тоді сюжет він придумає за ними.
    </p>
    <textarea class="notes" id="ownStory" rows="6"
      placeholder="Наприклад: Під Бакотською затокою лежить село, яке затопили…"></textarea>
    <input type="file" id="ownPhotos" accept="image/*" multiple hidden />
    <div class="own-files" id="ownFiles"></div>
    <div class="own-actions">
      <button class="btn secondary" id="ownPick">📎 Фото</button>
      <button class="btn primary" id="ownSend">Надіслати</button>
    </div>
  </div>

  <main id="app">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:120px"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const initData = tg?.initData || '';
    const haptic = (t='light') => tg?.HapticFeedback?.impactOccurred?.(t);
    const notify = (t='success') => tg?.HapticFeedback?.notificationOccurred?.(t);

    const $ = (sel) => document.querySelector(sel);
    const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1700);
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
    }

    function copyable({ label, icon, main, isDesc, raw }) {
      const box = el('div', 'copyable');
      box.appendChild(el('div', 'label', `${icon} ${label}`));
      box.appendChild(el('div', isDesc ? 'desc-text' : 'title-text', esc(main)));
      box.appendChild(el('div', 'tap', 'копіювати'));
      box.addEventListener('click', async () => {
        await copyText(raw ?? main);
        box.classList.add('copied'); box.querySelector('.tap').textContent = 'скопійовано ✓';
        haptic('light'); toast('Скопійовано');
        setTimeout(() => { box.classList.remove('copied'); box.querySelector('.tap').textContent = 'копіювати'; }, 1600);
      });
      return box;
    }

    // Bot API 8.0+ має нативне завантаження файлів у Mini App. На старіших
    // версіях Telegram відкриваємо attachment-посилання у зовнішньому браузері.
    function downloadVideo(item) {
      const fileName = item.fileName || `${String(item.id).replace(/[^A-Za-z0-9_.-]/g, '_')}.mp4`;
      const relativeUrl = item.downloadUrl || `${item.videoUrl}${item.videoUrl.includes('?') ? '&' : '?'}download=1`;
      const url = new URL(relativeUrl, window.location.href).href;
      haptic('light');

      const nativeDownloadSupported = tg?.downloadFile
        && (!tg.isVersionAtLeast || tg.isVersionAtLeast('8.0'));
      if (nativeDownloadSupported) {
        try {
          tg.downloadFile({ url, file_name: fileName }, (accepted) => {
            toast(accepted ? 'Завантаження розпочато' : 'Завантаження скасовано');
          });
          return;
        } catch (error) {
          console.warn('Telegram downloadFile не спрацював, відкриваю браузер:', error);
        }
      }

      if (tg?.openLink) {
        tg.openLink(url);
        toast('Відкриваю завантаження…');
        return;
      }

      const link = document.createElement('a');
      link.href = url; link.download = fileName; link.rel = 'noopener';
      document.body.appendChild(link); link.click(); link.remove();
      toast('Завантаження розпочато');
    }

    // Які картки розгорнуті (за id) — зберігається між оновленнями списку.
    const expanded = new Set();
    let expandInit = false;

    function queueCard(item) {
      const card = el('div', 'card'); card.dataset.id = item.id;

      // Шапка: жовтий кружечок «очікує публікації» + назва + шеврон.
      const head = el('div', 'card-head');
      head.appendChild(el('span', 'dot pending'));
      head.appendChild(el('div', 'head-title', esc(item.title)));
      head.appendChild(el('span', 'chev', '▶'));
      card.appendChild(head);

      const wrap = el('div', 'card-body-wrap');
      const vw = el('div', 'video-wrap');
      const v = el('video'); v.controls = true; v.playsInline = true; v.preload = 'none';
      v.dataset.src = item.videoUrl; // джерело вантажимо лише коли розгорнуто
      vw.appendChild(v); wrap.appendChild(vw);

      const body = el('div', 'card-body');
      if (item.theme) body.appendChild(el('div', 'kicker', esc(item.theme)));
      body.appendChild(copyable({ label: 'Назва', icon: '📌', main: item.title }));
      body.appendChild(copyable({ label: 'Опис + хештеги', icon: '📝', main: item.description, isDesc: true }));
      const actions = el('div', 'actions');
      const dl = el('button', 'btn secondary', '⬇️ Відео');
      dl.addEventListener('click', (e) => { e.stopPropagation(); downloadVideo(item); });
      const regen = el('button', 'btn secondary', '🔄'); regen.title = 'Перегенерувати'; regen.style.flex = '0 0 auto';
      regen.addEventListener('click', (e) => { e.stopPropagation(); regenerate(item, card, regen); });
      const pub = el('button', 'btn primary', '✅ Опубліковано');
      pub.addEventListener('click', (e) => { e.stopPropagation(); publish(item, card, pub); });
      // «Не опубліковано» — знімає мітки автопублікації, щоб ролик знову став
      // у чергу. Потрібно, коли пост видалили в мережі або він вийшов помилково.
      const undo = el('button', 'btn secondary', '↩️'); undo.title = 'Вважати неопублікованим';
      undo.style.flex = '0 0 auto';
      undo.addEventListener('click', async (e) => {
        e.stopPropagation();
        const old = undo.textContent;
        undo.disabled = true; undo.textContent = '…';
        try {
          const r = await fetch('/api/autopost/reset', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ initData, id: item.id }),
          });
          const data = await r.json();
          if (!r.ok || data.error) throw new Error(data.error || 'Помилка');
          notify('success');
          toast(data.skippedSlot
            ? `Повернуто в чергу, слот ${data.skippedSlot} пропущено`
            : 'Повернуто в чергу');
        } catch (err) { notify('error'); toast(err.message); }
        finally { undo.disabled = false; undo.textContent = old; }
      });
      actions.appendChild(dl); actions.appendChild(regen); actions.appendChild(undo); actions.appendChild(pub);
      body.appendChild(actions);
      wrap.appendChild(body);
      card.appendChild(wrap);

      const setOpen = (open) => {
        card.classList.toggle('open', open);
        if (open) { expanded.add(item.id); if (!v.src) v.src = v.dataset.src; }
        else expanded.delete(item.id);
      };
      head.addEventListener('click', () => setOpen(!card.classList.contains('open')));
      if (expanded.has(item.id)) setOpen(true);
      return card;
    }

    async function publish(item, card, btn) {
      if (!initData) { toast('Відкрий через Telegram, щоб публікувати'); return; }
      btn.disabled = true; btn.textContent = 'Публікую…';
      try {
        const r = await fetch('/api/publish', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: item.id, initData }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Помилка');
        btn.className = 'btn done'; btn.textContent = '✓ Опубліковано'; notify('success'); toast('Позначено як опубліковане');
        setTimeout(load, 900);
      } catch (e) {
        btn.disabled = false; btn.className = 'btn primary'; btn.textContent = '✅ Опубліковано';
        notify('error'); toast(e.message);
      }
    }

    function askConfirm(msg) {
      return new Promise((res) => { if (tg?.showConfirm) tg.showConfirm(msg, (ok) => res(ok)); else res(confirm(msg)); });
    }

    async function regenerate(item, card, btn) {
      if (!initData) { toast('Відкрий через Telegram'); return; }
      if (!(await askConfirm('Перегенерувати відео новим кодом? Старе буде замінено.'))) return;
      btn.disabled = true;
      try {
        const r = await fetch('/api/regenerate', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: item.id, initData }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Помилка');
        notify('success'); toast('Перегенеровую — нове відео прийде в Telegram');
        setTimeout(load, 1500);
      } catch (e) { btn.disabled = false; notify('error'); toast(e.message); }
    }

    function publishedRow(it) {
      const row = el('div', 'published-item');
      row.appendChild(el('div', 'dot'));
      const t = el('div', 'pi-text');
      t.appendChild(el('div', 'pi-title', esc(it.title || it.theme)));
      if (it.pubDate) t.appendChild(el('div', 'pi-date', esc(it.pubDate)));
      row.appendChild(t);
      return row;
    }

    // --- Тема на перевірку (рядок NEW у таблиці) ----------------------------
    // ChatGPT уже написав сюжет, але ще не малює. Тут його можна поправити —
    // зміни лягають назад у промт, за яким малюватимуться кадри.
    function pendingCard(item) {
      const box = el('div', 'card');
      const head = el('div', 'card-head');
      head.appendChild(el('span', 'dot pending'));
      head.appendChild(el('div', 'head-title', esc(item.theme || item.id)));
      head.appendChild(el('span', 'chev', '▶'));
      box.appendChild(head);

      const wrap = el('div', 'card-body-wrap');
      const body = el('div', 'card-body');
      body.appendChild(el('div', 'kicker',
        `${esc(item.id)} · ${item.slides.length} слайдів${item.created ? ` · ${esc(item.created)}` : ''}`));

      // Тема окремим полем: вона йде і в колонку C, і в заголовок промту.
      const themeBox = el('textarea', 'notes');
      themeBox.value = item.theme || '';
      themeBox.rows = 2;
      themeBox.style.margin = '0 0 10px';
      body.appendChild(themeBox);

      const autoFit = (ta) => {
        const fit = () => { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight}px`; };
        ta.addEventListener('input', fit);
        setTimeout(fit, 0);
      };

      const inputs = item.slides.map((line, i) => {
        const row = el('div', 'slide-row');
        row.appendChild(el('div', 'num', `СЛАЙД ${i + 1}`));
        const ta = el('textarea', 'notes');
        ta.value = line;
        ta.rows = 2;
        ta.style.margin = '4px 0 0';
        autoFit(ta);
        row.appendChild(ta);
        body.appendChild(row);
        return ta;
      });
      autoFit(themeBox);

      const actions = el('div', 'actions');

      // Відхилення незворотне (рядок зникає з таблиці), тож питаємо підтвердження.
      const drop = el('button', 'btn secondary', '🗑');
      drop.title = 'Відхилити тему';
      drop.style.flex = '0 0 auto';
      drop.addEventListener('click', () => {
        const ask = (fn) => (tg?.showConfirm
          ? tg.showConfirm('Відхилити цю тему? Рядок зникне з таблиці, а тема більше не пропонуватиметься.', (ok) => ok && fn())
          : (confirm('Відхилити цю тему?') && fn()));
        ask(async () => {
          const old = drop.textContent;
          drop.disabled = true; drop.textContent = '…';
          try {
            const r = await fetch('/api/pending/reject', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ initData, id: item.id }),
            });
            const data = await r.json();
            if (!r.ok || data.error) throw new Error(data.error || 'Помилка');
            notify('success'); toast('Тема відхилена');
            box.remove();
            load();
          } catch (e) { notify('error'); toast(e.message); }
          finally { drop.disabled = false; drop.textContent = old; }
        });
      });
      actions.appendChild(drop);

      const save = el('button', 'btn primary', '💾 Зберегти');
      save.addEventListener('click', async () => {
        const old = save.textContent;
        save.disabled = true; save.textContent = 'Зберігаю…';
        try {
          const r = await fetch('/api/pending/save', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              initData, id: item.id,
              theme: themeBox.value.trim(),
              slides: inputs.map((t) => t.value),
            }),
          });
          const data = await r.json();
          if (!r.ok || data.error) throw new Error(data.error || 'Помилка');
          notify('success'); toast('Збережено в таблицю');
        } catch (e) { notify('error'); toast(e.message); }
        finally { save.disabled = false; save.textContent = old; }
      });
      actions.appendChild(save);
      body.appendChild(actions);

      wrap.appendChild(body);
      box.appendChild(wrap);

      const setOpen = (open) => box.classList.toggle('open', open);
      head.addEventListener('click', () => { haptic(); setOpen(!box.classList.contains('open')); });
      return box;
    }

    function render(state) {
      const app = $('#app'); app.innerHTML = '';
      const banner = $('#banner'); banner.innerHTML = '';
      if (!state.googleReady) banner.appendChild(el('div', 'banner', '⚙️ Google-доступ ще не налаштовано на сервері — черга поки порожня.'));
      else if (state.videoFolderSet === false) banner.appendChild(el('div', 'banner', '⚙️ Не задано папку Drive для відео (VIDEO_FOLDER_ID) — монтаж вимкнено.'));

      const pending = (state.pending || []).filter((p) => p.slides && p.slides.length);
      if (pending.length) {
        app.appendChild(el('h2', 'section', pending.length > 1 ? 'Теми на перевірку' : 'Тема на перевірку'));
        pending.forEach((p) => app.appendChild(pendingCard(p)));
      }

      const q = state.queue || [];
      $('#count').textContent = q.length ? `${q.length} до публікації` : '';
      // За замовчуванням розгортаємо лише найновішу картку; решта — згорнуті.
      if (!expandInit && q.length) { expanded.add(q[0].id); expandInit = true; }

      if (q.length) {
        app.appendChild(el('h2', 'section', 'До публікації'));
        q.forEach((item) => app.appendChild(queueCard(item)));
      } else {
        app.appendChild(el('div', 'empty', '<div class="big">✅</div>Немає нових роликів.<br>О 08:00 приходить тема, о 15:00 — фото.<br>Щойно відео буде готове, я напишу.'));
      }

      const p = state.published || [];
      if (p.length) {
        app.appendChild(el('h2', 'section', `Опубліковано · ${p.length}`));
        p.slice(0, 40).forEach((it) => app.appendChild(publishedRow(it)));
      }
    }

    async function load() {
      try {
        const state = await fetch('/api/state').then((r) => r.json());
        render(state);
      } catch (e) {
        $('#app').innerHTML = `<div class="empty"><div class="big">⚠️</div>Не вдалося завантажити.<br>${esc(e.message)}</div>`;
      }
    }

    // --- Свій сюжет ---------------------------------------------------------
    // Фото шлемо по одному окремими запитами: десяток знімків із телефона в
    // одному тілі запиту — це десятки мегабайт base64, що впирається в ліміти
    // проксі. По одному ще й дає чесний прогрес.
    let ownPicked = [];

    function ownRenderFiles() {
      const box = $('#ownFiles'); box.innerHTML = '';
      ownPicked.forEach((f, i) => {
        const chip = el('span', 'own-chip', `${i + 1}. ${esc(f.name)}`);
        box.appendChild(chip);
      });
    }

    const readAsBase64 = (file) => new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error(`Не вдалося прочитати ${file.name}`));
      r.readAsDataURL(file);
    });

    $('#ownToggle').addEventListener('click', () => {
      haptic();
      $('#ownPanel').classList.toggle('open');
    });
    $('#ownPick').addEventListener('click', () => $('#ownPhotos').click());
    $('#ownPhotos').addEventListener('change', (e) => {
      ownPicked = [...e.target.files].slice(0, 10);
      ownRenderFiles();
    });

    $('#ownSend').addEventListener('click', async () => {
      const btn = $('#ownSend');
      const story = $('#ownStory').value.trim();
      if (!story && !ownPicked.length) { toast('Додай сюжет або хоча б одне фото'); return; }
      const old = btn.textContent;
      btn.disabled = true;
      try {
        btn.textContent = 'Готую…';
        const start = await fetch('/api/own/start', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ initData }),
        }).then((r) => r.json());
        if (start.error) throw new Error(start.error);

        for (let i = 0; i < ownPicked.length; i++) {
          btn.textContent = `Фото ${i + 1} з ${ownPicked.length}…`;
          const file = ownPicked[i];
          const res = await fetch('/api/own/photo', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              initData, folderId: start.folderId, index: i + 1,
              name: file.name, mimeType: file.type, data: await readAsBase64(file),
            }),
          }).then((r) => r.json());
          if (res.error) throw new Error(res.error);
        }

        btn.textContent = 'Записую…';
        const out = await fetch('/api/own/submit', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            initData, id: start.id, folderId: start.folderId,
            folderUrl: start.folderUrl, story, photoCount: ownPicked.length,
          }),
        }).then((r) => r.json());
        if (out.error) throw new Error(out.error);

        notify('success');
        toast(`Прийнято: ${out.id}`);
        $('#ownStory').value = ''; ownPicked = []; ownRenderFiles();
        $('#ownPanel').classList.remove('open');
      } catch (e) {
        notify('error');
        toast(e.message);
      } finally {
        btn.disabled = false; btn.textContent = old;
      }
    });

    load();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
