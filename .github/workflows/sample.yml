name: sample

# Тестер голосів озвучки: Actions → sample → Run workflow → обрати голос.
# Зразок відео про колібрі з цим голосом прийде в Telegram.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Рушій (openai або edge)
        default: openai
        type: choice
        options: [openai, edge]
      voice:
        description: Голос OpenAI (cedar, marin, ash, onyx, nova, coral...)
        default: cedar

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Встановити edge-tts
        run: pip install edge-tts

      - name: Зібрати і надіслати зразок
        run: node sample/build-sample.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_ENGINE: ${{ inputs.engine }}
          TTS_OPENAI_VOICE: ${{ inputs.voice }}
