name: themes

on:
  # РОЗКЛАД ВИМКНЕНО. Теми тепер вигадує ChatGPT і пише їх у Google Sheet —
  # бот більше не генерує тем і не шле ранкових/вечірніх промтів. Лишаємо
  # лише ручний запуск на випадок потреби.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: themes
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Згенерувати тему і надіслати промпт
        run: node src/themes.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
