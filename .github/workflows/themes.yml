name: themes

on:
  schedule:
    # Київ ~10:07 (відео), ~18:07 (відео), ЛІТНІЙ час (UTC+3). Хвилина 7,
    # а не 0: «круглі» хвилини у GitHub перевантажені, і такі крони
    # затримуються найсильніше.
    # Взимку (UTC+2) перемкнути на '7 8' і '7 16' — див. README.
    - cron: '7 7 * * *'
    # Обідня фото-карусель (~13:07 Київ) — ТИМЧАСОВО ВИМКНЕНО. Код каруселі
    # лишається (prompt.carousel.template.txt, sendCarouselTheme, слот).
    # Щоб увімкнути знову — розкоментуй рядок нижче (взимку '7 11 * * *'):
    # - cron: '7 10 * * *'
    - cron: '7 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: themes
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Згенерувати тему і надіслати промпт
        run: node src/themes.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
