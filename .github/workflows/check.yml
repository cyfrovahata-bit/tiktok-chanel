name: check

on:
  # РОЗКЛАД ВИМКНЕНО. Старий Telegram-конвеєр (ручне залиття zip → монтаж)
  # замінено новим потоком: ChatGPT кладе архів на Google Drive і пише рядок
  # у Google Sheet, а додаток на Railway (web/server.js + monitor.js) сам
  # моніторить чергу, монтує відео і шле сповіщення. Лишаємо тільки ручний
  # запуск на випадок налагодження старого шляху.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити FFmpeg і unzip
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg unzip

      - name: Встановити edge-tts (озвучка)
        run: pip install edge-tts

      - name: Обробити оновлення Telegram
        run: node src/check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENABLE_TTS: "1"
          TTS_ENGINE: elevenlabs  # інші: openai, edge; при падінні — автофолбек
          TTS_ELEVEN_VOICE_ID: MajbwhPMg2mRJJCesMAF  # Oleksii Safin — Friendly Storyteller (укр.)
          # попередній: N2lVS1w4EtoT3dr4eOWO  # Callum (англ.)
          # TTS_ELEVEN_MODEL: eleven_v3                # стабільніше: eleven_multilingual_v2
          # TTS_OPENAI_VOICE: cedar      # інші: marin, ash, onyx, nova, coral...
          # TTS_VOICE: uk-UA-OstapNeural # голос edge; жіночий: uk-UA-PolinaNeural
