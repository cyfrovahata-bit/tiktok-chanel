name: check

on:
  schedule:
    # Робочі вікна після тем (UTC, ЛІТНІЙ час — Київ = UTC+3):
    # кожні 5 хв першу годину після теми, далі кожні 15 хв.
    # Хвилини зсунуті з «круглих» (:00/:15/:30), бо ті у GitHub
    # перевантажені й затримуються найсильніше.
    # Взимку зсунути всі години на +1 — див. README.
    - cron: '13-58/5 7 * * *'
    - cron: '9-59/15 8-10 * * *'
    - cron: '13-58/5 15 * * *'
    - cron: '9-59/15 16-18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Встановити edge-tts (озвучка)
        run: pip install edge-tts

      - name: Обробити оновлення Telegram
        run: node src/check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_TTS: "1"
          TTS_ENGINE: openai  # 'edge' — безкоштовний Microsoft-голос (фолбек)
          # TTS_OPENAI_VOICE: ash        # інші: onyx, nova, coral, alloy...
          # TTS_VOICE: uk-UA-OstapNeural # голос edge; жіночий: uk-UA-PolinaNeural
