name: redo

# Одноразовий воркфлоу: перемонтовує коралове відео з правильними фото
# (виправлення інциденту, коли в кадр потрапили старі фото морської
# зірки через баг офсету). Видаляється після використання.
on:
  workflow_dispatch:

jobs:
  redo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Зібрати і надіслати виправлене відео
        run: node redo/build.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_ENGINE: elevenlabs
